name: Bug Report
description: Report something that is not working as expected
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Before submitting, please search [this project's issues](https://github.com/3035936740/memos-plus/issues) and check [its releases](https://github.com/3035936740/memos-plus/releases). For project coordination, see [the maintainer's profile](https://github.com/3035936740).
        Do not disclose vulnerabilities here; follow [SECURITY.md](https://github.com/3035936740/memos-plus/blob/main/SECURITY.md).

  - type: checkboxes
    id: pre-check
    attributes:
      label: Check before submitting
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Tell us what happened and what you expected instead.
      placeholder: |
        What happened:
        What I expected:
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Give us the shortest steps that reproduce the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Memos Plus version
      description: Include the Plus version or commit and image tag. The upstream schema version alone is not the Plus release version.
      placeholder: "Plus version / image tag or main@abcdef"
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add relevant deployment details, logs, screenshots, or recordings. Remove secrets before submitting.
      placeholder: |
        Deployment / database / browser:
        Logs or screenshots:
