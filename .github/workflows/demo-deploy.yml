name: Memos Plus Demo Health
# Deployment is managed by the site owner; no upstream Render deploy hook.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check the public Memos Plus demo
        run: curl --fail --retry 2 --max-time 30 https://memos.bing.tomato-universe.tech/
