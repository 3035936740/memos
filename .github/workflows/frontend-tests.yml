name: Plus frontend checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.0.1"
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Type and style checks
        run: pnpm lint
        working-directory: web
      - name: Check all translation catalogs
        run: pnpm lint:i18n
        working-directory: web
      - name: Current frontend unit tests
        run: pnpm test
        working-directory: web
      - name: Build embedded production assets
        run: pnpm release
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: ci-frontend-dist
          path: server/router/frontend/dist
          if-no-files-found: error
          retention-days: 1
