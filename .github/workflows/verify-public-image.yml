name: Verify Public Image

on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true

permissions:
  contents: read

jobs:
  anonymous-pull-and-resource-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check image verifier readiness handling
        run: python3 -B -m unittest discover -s scripts -p test_resource_benchmark.py
      - uses: docker/setup-buildx-action@v3
      - name: Verify anonymous pull, platforms and constrained startup
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          docker manifest inspect "$IMAGE" > manifest.json
          jq -e '[.manifests[].platform | .os + "/" + .architecture + (if .architecture == "arm" then "/" + (.variant // "") else "" end)] | contains(["linux/amd64","linux/arm64","linux/arm/v7"])' manifest.json
          docker pull "$IMAGE"
          python3 scripts/resource_benchmark.py "$IMAGE" > resource-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-image-resource-check
          path: |
            manifest.json
            resource-benchmark.json
