name: Plus protocol checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.50.0"
          github_token: ${{ github.token }}
      - name: Lint only repository protocols
        run: buf lint proto
      - name: Check formatting and show the actual diff
        run: buf format proto --diff --exit-code
