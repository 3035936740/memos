syntax = "proto3";

package memos.store;

option go_package = "gen/store";

message MemoPayload {
  Property property = 1;

  Location location = 2;

  repeated string tags = 3;

  // Optional. Instance category slug assigned by the memo author.
  string category = 4;

  // Whether the memo is omitted from collection views while remaining
  // reachable through its direct URL according to its visibility.
  bool hidden = 5;

  // Draft memos are only visible to their creator and instance admins until
  // publish_ts is reached. A zero publish_ts means the draft is not scheduled.
  bool draft = 6;

  // Unix timestamp at which a scheduled draft becomes publicly listable.
  int64 publish_ts = 7;

  // Quarantined memos and comments are visible only to instance admins.
  bool quarantined = 8;

  // Whether the memo creator identity is hidden from everyone except instance
  // administrators. The creator relationship remains stored for permissions,
  // moderation, and reporting.
  bool anonymous = 9;

  // Administrator-authored JavaScript that runs only while this memo or
  // comment is mounted on its detail page.
  string admin_script = 11;

  // The calculated properties from the memo content.
  message Property {
    bool has_link = 1;
    bool has_task_list = 2;
    bool has_code = 3;
    bool has_incomplete_tasks = 4;
    // The title extracted from the first H1 heading, if present.
    string title = 5;
  }

  message Location {
    string placeholder = 1;
    double latitude = 2;
    double longitude = 3;
  }

}
